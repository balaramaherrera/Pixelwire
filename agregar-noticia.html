<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agregar noticia | RicardoInfoTv</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="editor-page">
  <header class="site-header">
    <div class="wrap header-inner">
      <a href="index.html" class="logo">RICARDO<span>INFOTV</span></a>
      <a href="index.html" class="editor-back">Volver a noticias</a>
    </div>
  </header>

  <main class="editor-main">
    <div class="wrap">
      <div class="editor-header">
        <h1>Agregar noticia</h1>
        <p>Crea una noticia nueva y elige en qué sección de RicardoInfoTv se va a mostrar.</p>
      </div>
      <section class="editor-panel" aria-labelledby="editor-title">
        <form class="editor-form" id="new-news-form">
          <div class="editor-field">
            <label for="section">Sección / categoría</label>
            <select id="section" name="section" required></select>
          </div>
          <div class="editor-field">
            <label for="title">Título</label>
            <input id="title" name="title" type="text" required maxlength="140">
          </div>
          <div class="editor-field">
            <label for="category">Etiqueta a mostrar</label>
            <input id="category" name="category" type="text" required maxlength="40" placeholder="Ej. Noticias, Reseña, Guías…">
          </div>
          <div class="editor-field">
            <label for="author">Autor</label>
            <input id="author" name="author" type="text" maxlength="60" placeholder="Redacción RicardoInfoTv">
          </div>
          <div class="editor-field">
            <label for="time">Tiempo de publicación</label>
            <input id="time" name="time" type="text" maxlength="40" placeholder="Hace 5 min">
          </div>
          <div class="editor-field">
            <label for="image">URL de imagen</label>
            <input id="image" name="image" type="url" required placeholder="https://…">
          </div>
          <div class="editor-field">
            <label for="content">Contenido de la noticia</label>
            <textarea id="content" name="content" rows="10" placeholder="Escribe aquí el texto completo de la noticia. Separa los párrafos dejando una línea en blanco entre ellos."></textarea>
          </div>
          <p class="editor-error" id="editor-error" role="alert" hidden></p>
          <div class="editor-actions">
            <button class="editor-button editor-button--save" type="submit">Publicar noticia</button>
            <a class="editor-button editor-button--cancel" href="index.html">Cancelar</a>
          </div>
        </form>
      </section>
    </div>
  </main>

  <script src="js/news.js"></script>
  <script src="js/sections.js"></script>
  <script>
    const sectionSelect = document.getElementById("section");
    const sections = getSections();
    Object.entries(sections).forEach(([sectionId, section]) => {
      const option = document.createElement("option");
      option.value = sectionId;
      option.textContent = section.title;
      sectionSelect.appendChild(option);
    });

    const presetSection = new URLSearchParams(window.location.search).get("section");
    if (presetSection && sections[presetSection]) {
      sectionSelect.value = presetSection;
      document.getElementById("category").value = sections[presetSection].title;
    }

    sectionSelect.addEventListener("change", () => {
      const categoryInput = document.getElementById("category");
      if (!categoryInput.value.trim()) {
        categoryInput.value = sections[sectionSelect.value].title;
      }
    });

    const form = document.getElementById("new-news-form");
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const data = Object.fromEntries(new FormData(form).entries());
      const newId = addCustomCard(data);
      window.location.href = `articulo.html?id=${encodeURIComponent(newId)}`;
    });
  </script>
</body>
</html>
