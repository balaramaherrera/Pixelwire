<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Inicia sesión en RicardoInfoTv.">
<title>Iniciar sesión | RicardoInfoTv</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="editor-page">
  <header class="site-header">
    <div class="wrap header-inner">
      <a href="index.html" class="logo">RICARDO<span>INFOTV</span></a>
      <a href="index.html" class="editor-back">Volver al inicio</a>
    </div>
  </header>

  <main class="auth-main">
    <section class="auth-panel" aria-labelledby="login-title">
      <span class="tag tag--accent">Acceso</span>
      <h1 id="login-title">Iniciar sesión</h1>
      <p>Accede a tu cuenta de RicardoInfoTv.</p>
      <form class="auth-form" id="login-form">
        <div class="editor-field">
          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="editor-field">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <p class="auth-message" id="auth-message" role="alert"></p>
        <button class="auth-submit" type="submit">Entrar</button>
      </form>
      <p class="auth-notice">Esta versión guarda las cuentas únicamente en este navegador.</p>
    </section>
  </main>

  <script src="js/auth.js?v=3"></script>
</body>
</html>
